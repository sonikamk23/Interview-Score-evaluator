<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerForge AI Pro | Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="page-shell auth-shell">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <img src="assets/logo.svg" alt="CareerForge AI Pro" class="brand-logo" />
                <div>
                    <h1>Create Your Account</h1>
                    <p>Start building your interview readiness profile today.</p>
                </div>
            </div>
            <form id="signup-form" class="auth-form">
                <div class="field-row">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Your name" required />
                </div>
                <div class="field-row">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required />
                </div>
                <div class="field-row">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required />
                </div>
                <button type="submit" class="button button-primary">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
