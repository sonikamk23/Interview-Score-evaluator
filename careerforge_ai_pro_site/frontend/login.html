<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerForge AI Pro | Login</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="page-shell auth-shell">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <img src="assets/logo.svg" alt="CareerForge AI Pro" class="brand-logo" />
                <div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue to your interview readiness dashboard.</p>
                </div>
            </div>
            <form id="login-form" class="auth-form">
                <div class="field-row">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required />
                </div>
                <div class="field-row">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="button button-primary">Sign In</button>
            </form>
            <p class="auth-footer">New to CareerForge? <a href="signup.html">Create an account</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
